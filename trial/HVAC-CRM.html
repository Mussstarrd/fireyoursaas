<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>HVAC CRM</title>
<style>
/* fireyourSaaS CRM — screen styles. Phone first, big targets, no decoration. */
:root {
  --ink: #17202c; --muted: #6b7482; --line: #d9dde3; --bg: #f3f4f6; --card: #fff;
  --navy: #13294b; --orange: #e05a1b; --orange-dark: #b9470f; --green: #0a7a2f; --red: #b3261e; --amber: #9a6700;
  --tap: 46px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
/* Shown unless boot() hides it — a file cut short never runs boot. The delay keeps a normal open from flashing it. */
#damaged { display: block; padding: 24px; font-size: 20px; color: var(--red); opacity: 0; animation: fys-show 0s 1.5s forwards; }
@keyframes fys-show { to { opacity: 1; } }
#print { display: none; }

/* ---- frame ---- */
#app { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
header.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
             background: var(--navy); color: #fff; padding-top: max(8px, env(safe-area-inset-top)); }
header.bar .title { flex: 1; font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
header.bar button { min-height: 44px; min-width: 44px; padding: 0 14px; border: 0; border-radius: 8px; background: rgba(255,255,255,.14); color: #fff; font-weight: 600; }
header.bar button.save { background: var(--orange); }
header.bar button.save.dirty::after { content: " •"; }
header.bar button.icon { padding: 0 12px; font-size: 22px; line-height: 1; min-width: 46px; }
main { flex: 1; padding: 12px 12px 90px; max-width: 760px; width: 100%; margin: 0 auto; }
nav.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; display: flex; background: var(--card); border-top: 1px solid var(--line);
           padding-bottom: env(safe-area-inset-bottom); }
nav.tabs button { flex: 1; min-height: 56px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 15px; }
nav.tabs button.on { color: var(--orange-dark); box-shadow: inset 0 3px 0 var(--orange); }
@media print { #app { display: none; } }

/* ---- pieces ---- */
h2 { font-size: 20px; margin: 6px 0 10px; }
h3 { font-size: 15px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.right { text-align: right; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }
.money { font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.btn { min-height: var(--tap); padding: 0 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); font-weight: 600; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.danger { color: var(--red); }
.btn.wide { width: 100%; margin-top: 8px; }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.x { min-width: 44px; min-height: 44px; border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
.field label { font-size: 14px; color: var(--muted); }
.field input, .field select, .field textarea, .lines input, .lines select {
  min-height: var(--tap); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; }
.field textarea { min-height: 80px; }
.field input:focus, select:focus, textarea:focus { outline: 2px solid var(--orange); outline-offset: 0; border-color: var(--orange); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 0 10px; }
.list .item { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px 12px; background: var(--card);
              border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; width: 100%; text-align: left; }
.list .item .main { flex: 1; min-width: 0; }
.list .item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 13px; font-weight: 600; background: #e9ecf1; color: var(--muted); }
.chip.issued { background: #dff3e5; color: var(--green); }
.chip.draft { background: #fff1e6; color: var(--orange-dark); }
.chip.void { background: #f2dcdb; color: var(--red); }
.flag { color: var(--amber); font-size: 14px; }
.warn { background: #fff7e0; border: 1px solid #f1dc9a; border-radius: 8px; padding: 8px 10px; font-size: 15px; margin-bottom: 10px; }
.banner { background: #fff1e6; border: 1px solid #f3c7ac; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
.toggle { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-weight: 600; font-size: 15px; }
.toggle.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.toast { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); z-index: 9; background: var(--ink); color: #fff; padding: 10px 16px;
         border-radius: 10px; font-weight: 600; max-width: 90vw; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.menu { position: fixed; top: 52px; right: 8px; z-index: 8; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0,0,0,.18); min-width: 200px; overflow: hidden; }
.menu button { display: block; width: 100%; min-height: 48px; padding: 0 16px; border: 0; background: none; text-align: left; font-weight: 600; }
.menu button:active { background: var(--bg); }
.menu .sep { border-top: 1px solid var(--line); }
.backdrop { position: fixed; inset: 0; z-index: 7; }
.modal { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
.modal .sheet { background: var(--card); width: 100%; max-width: 560px; border-radius: 14px 14px 0 0; padding: 16px; max-height: 88vh; overflow: auto; }
.modal .sheet h2 { margin-top: 0; }
.modal .actions { display: flex; gap: 8px; margin-top: 12px; }
.modal .actions .btn { flex: 1; }
.dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

.backupbar { display: flex; gap: 10px; align-items: center; background: #fff7e0; border-bottom: 1px solid #f1dc9a; padding: 8px 12px; }
.backupbar .txt { flex: 1; font-size: 14px; }

/* ---- pickers ---- */
.pick { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; min-height: var(--tap); padding: 6px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; }
.pick .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick.blank .val { color: var(--muted); }
.pick .chev { color: var(--muted); }
.pick:disabled { background: var(--bg); color: var(--muted); }
.pick:focus { outline: 2px solid var(--orange); outline-offset: 0; }
.modal .sheet.picker { padding: 0; display: flex; flex-direction: column; height: 88vh; overflow: hidden; }
.picker .head { display: flex; gap: 6px; align-items: center; padding: 8px 8px 8px 12px; border-bottom: 1px solid var(--line); }
.picker .head input { flex: 1; min-height: 40px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.picker .rows { overflow: auto; flex: 1; -webkit-overflow-scrolling: touch; }
.picker .cat { position: sticky; top: 0; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted);
  background: var(--bg); padding: 8px 12px 4px; border-bottom: 1px solid var(--line); }
.picker .row { display: block; width: 100%; min-height: 46px; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--line); background: var(--card); text-align: left; }
.picker .row.cur { color: var(--orange); font-weight: 600; }
.picker .row:active { background: #fff1e6; }

/* ---- quote editor ---- */
.lines .line { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
.lines .line.changed { animation: flash 1.2s; }
@keyframes flash { 0% { background: #fff1e6; } 100% { background: var(--card); } }
.lines .line .top { display: flex; gap: 8px; align-items: center; }
.lines .line .top select, .lines .line .top input, .lines .line .top .pick { flex: 1; }
.lines .line .opts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.lines .line .opts input.qty { width: 74px; text-align: center; }
.lines .line .opts select.warranty { flex: 1; min-width: 150px; }
.lines .line .price { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; }
.lines .line .price .detail { font-size: 14px; color: var(--muted); }
.totals { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.totals .row { min-height: 42px; }
.totals .row input { width: 110px; text-align: right; min-height: 40px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; }
.totals .grand { border-top: 2px solid var(--ink); margin-top: 6px; padding-top: 8px; font-size: 20px; }
.pad { display: block; width: 100%; height: 180px; background: #fff; border: 1px solid var(--line); border-radius: 10px; touch-action: none; }
.accepted .sig { display: block; height: 48px; margin-top: 6px; }
.frozen { background: #eef3fb; border: 1px solid #c8d6ee; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 15px; }
.actions2 { display: flex; gap: 8px; margin-top: 12px; }
.actions2 .btn { flex: 1; }
.rates { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 16px; }
.rates .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.slots .slot { display: grid; grid-template-columns: 1fr 70px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
.slots .slot input { text-align: center; }
.search { margin-bottom: 10px; }
.search input { width: 100%; min-height: var(--tap); padding: 6px 12px; border: 1px solid var(--line); border-radius: 9px; }
.empty { color: var(--muted); text-align: center; padding: 30px 10px; }

</style>
<style>
/* fireyourSaaS CRM — the customer's page. Only #print is visible when printing. */
@media print {
  @page { margin: 0; size: auto; }
  html, body { background: #fff; }
  body { margin: 0; color: #000; }
  #app, #damaged, .toast, .menu, .modal, .backdrop { display: none !important; }
  #print { display: block !important; }
}
#print { font: 12pt/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #000; padding: 0.6in 0.65in; max-width: 8.5in; margin: 0 auto; }
#print.preview { display: block; background: #fff; }
#print .head { display: flex; justify-content: space-between; gap: 20px; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 14px; }
#print .biz { font-size: 11pt; }
#print .biz .name { font-size: 18pt; font-weight: 700; }
#print .qmeta { text-align: right; font-size: 11pt; }
#print .qmeta .n { font-size: 16pt; font-weight: 700; }
#print .cust { margin-bottom: 14px; font-size: 11pt; }
#print .cust .label { font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; color: #444; }
#print table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
#print th { text-align: left; font-size: 9pt; text-transform: uppercase; letter-spacing: .06em; color: #444; border-bottom: 1px solid #000; padding: 4px 6px; }
#print td { padding: 6px; border-bottom: 1px solid #ddd; vertical-align: top; }
#print td.n, #print th.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
#print td .sub { font-size: 9.5pt; color: #444; }
#print .tot { width: 3.4in; margin-left: auto; font-variant-numeric: tabular-nums; }
#print .tot .r { display: flex; justify-content: space-between; padding: 3px 6px; }
#print .tot .r.grand { border-top: 2px solid #000; margin-top: 4px; padding-top: 6px; font-size: 14pt; font-weight: 700; }
#print .terms { margin-top: 20px; font-size: 9.5pt; color: #222; border-top: 1px solid #000; padding-top: 8px; white-space: pre-wrap; }
#print .sign { margin-top: 28px; display: flex; gap: 30px; font-size: 10pt; }
#print .sign > div { flex: 1; }
#print .sign .above { height: 48px; display: flex; align-items: flex-end; font-size: 11pt; }
#print .sign img, #print .sign canvas { display: block; height: 46px; }
#print .sign .label { border-top: 1px solid #000; padding-top: 4px; }

</style>

  // Everything that would put a wrong number in front of a customer. Used by BOTH Lock and Print,

  // The customer signs on the phone; the signature and name live in the quote and print on the page.
  // ---- signature ---------------------------------------------------------------------------------
  // Stored shape: { w, h, strokes: [[x,y,x,y,...], ...] }, integers, in pad coordinates. A whole signature
  // is about a kilobyte. Older files hold a PNG data URL in `signature` instead; both are drawn.
  var SIG_W = 600, SIG_H = 220;

    wrap.appendChild(pc);

    wrap.appendChild(el('h3', { text: 'Parts markup tiers' }));
    var tc = el('div', { class: 'card' });
    s.tiers = s.tiers || {};
    function tch(key) { return function (from, to) { S.logChange(state.doc, 'settings', 'tiers.' + key, key, from, to); touched(); }; }
    tc.appendChild(el('div', { class: 'grid2' }, [field('Under $', numInput(s.tiers, 't1', tch('t1'), { min: '0' })), field('× markup', numInput(s.tiers, 'm1', tch('m1'), { min: '0' }))]));
    tc.appendChild(el('div', { class: 'grid2' }, [field('Under $', numInput(s.tiers, 't2', tch('t2'), { min: '0' })), field('× markup', numInput(s.tiers, 'm2', tch('m2'), { min: '0' }))]));
    tc.appendChild(el('div', { class: 'grid2' }, [field('Under $', numInput(s.tiers, 't3', tch('t3'), { min: '0' })), field('× markup', numInput(s.tiers, 'm3', tch('m3'), { min: '0' }))]));
    tc.appendChild(field('Above that × markup', numInput(s.tiers, 'm4', tch('m4'), { min: '0' })));
    wrap.appendChild(tc);

    wrap.appendChild(el('h3', { text: 'Warranty tiers' }));
    var wc = el('div', { class: 'card' });
    s.warranties = s.warranties || [];
    s.warranties.forEach(function (w, i) {
      wc.appendChild(el('div', { class: 'grid3' }, [
        field('Label', textIn(w, 'label', function (from, to) {
          if (to && s.warranties.some(function (o) { return o !== w && o.label === to; })) { w.label = from; toast('That warranty label is already used.', true); render(); return; }
          renameEverywhere('warranty', from, to); S.logChange(state.doc, 'settings', 'warranty ' + (i + 1), 'label', from, to); touched();
        }, { 'data-k': 'w' + i + '.label' })),
        field('× price', numInput(w, 'multiplier', function (from, to) { S.logChange(state.doc, 'settings', 'warranty ' + (i + 1), 'multiplier', from, to); touched(); }, { min: '0', 'data-k': 'w' + i + '.mult' })),
        el('div', { class: 'field' }, [el('label', { text: ' ' }), el('button', { class: 'x', text: '✕', onclick: function () {
          renameEverywhere('warranty', w.label, '');           // lines on this tier go back to standard
          S.logChange(state.doc, 'settings', 'warranty ' + (i + 1), 'removed', w.label, ''); s.warranties.splice(i, 1); touched(); render();
        } })])
      ]));
    });
    wc.appendChild(el('button', { class: 'btn small', text: '+ Tier', onclick: function () { s.warranties.push({ label: '', multiplier: 1 }); touched(); render(); } }));
    wrap.appendChild(wc);

    wrap.appendChild(el('h3', { text: 'Terms printed on every quote' }));
    wrap.appendChild(el('div', { class: 'card' }, [el('div', { class: 'field' }, [
      el('textarea', { value: state.doc.terms || '', onchange: function (e) { state.doc.terms = e.target.value; touched(); } })])]));

    if (state.doc.priceLog.length) {
      wrap.appendChild(el('h3', { text: 'Recent price changes' }));
      var lg = el('div', { class: 'card small' });
      state.doc.priceLog.slice(-15).reverse().forEach(function (e) {
        lg.appendChild(el('div', { text: fmtTime(e.at) + ' · ' + e.name + ' ' + e.field + ': ' + (e.from === null || e.from === undefined ? '—' : e.from) + ' → ' + (e.to === null || e.to === undefined ? '—' : e.to) }));
      });
      wrap.appendChild(lg);
    }
    return wrap;
  }

  root.FYS.ui = { boot: boot, customerView: customerView, renderPrint: renderPrint, money: money, state: state, render: render, hasSig: hasSig };
})(window);

</script>
